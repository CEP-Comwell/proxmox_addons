---
 - name: Restart ovn services
   service:
     name: "{{ item }}"
     state: restarted
   loop: "{{ ovn_central_services }}"

 - name: daemon-reload-and-restart-ovn
   block:
     - name: Reload systemd
       command: systemctl daemon-reload

     - name: Ensure ovn-local enabled and restarted
       systemd:
         name: ovn-local
         state: restarted
         enabled: yes
