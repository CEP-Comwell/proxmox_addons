---
# Main tasks for ovn-central role
- name: Install required packages for OVN central
  package:
    name: "{{ ovn_central_packages }}"
    state: present

- name: Ensure /etc/ovn exists
  file:
    path: /etc/ovn
    state: directory
    mode: '0755'

- name: Deploy ovn-northd config when provided
  template:
    src: ovn-northd.conf.j2
    dest: /etc/ovn/ovn-northd.conf
    mode: '0644'
  when: ovn_northd_config is defined and (ovn_northd_config | length) > 0
  notify: Restart ovn services

- name: Ensure OVN central services are enabled and running
  service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ ovn_central_services }}"
